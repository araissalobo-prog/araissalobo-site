<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raíssa Lobo | Marca para mentores</title>
<meta name="description" content="Marca genérica compete por preço. Marca original é a escolha óbvia.">
<meta property="og:title" content="Raíssa Lobo | Marca para mentores">
<meta property="og:description" content="Marca genérica compete por preço. Marca original é a escolha óbvia.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://araissalobo.com.br/raissa.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--grafite:#1d1a18;--creme:#efe7da;--vinho:#4a1b26;--cobre:#b3693f;--cobre-claro:#d29a73;--suave:rgba(239,231,218,.7)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--grafite);background-image:linear-gradient(170deg,#1d1a18 0%,#1d1a18 55%,#33161e 100%);color:var(--creme);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:max(40px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(36px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
main{width:100%;max-width:460px;text-align:center}
.foto{width:108px;height:108px;border-radius:50%;object-fit:cover;object-position:50% 14%;margin:0 auto 18px;border:2px solid var(--cobre);display:block}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:34px;line-height:1.1}
.tag{margin-top:8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cobre-claro)}
.frase{margin:22px auto 0;max-width:22em;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;line-height:1.25;color:var(--suave)}
.frase em{color:var(--cobre-claro)}
.botoes{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.btn{display:block;text-decoration:none;text-align:left;border-radius:2px;padding:18px 20px;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid var(--cobre-claro);outline-offset:3px}
.btn strong{display:block;font-size:17px;font-weight:600}
.btn span{display:block;margin-top:3px;font-size:14px;line-height:1.4}
.btn-1{background:var(--creme);color:var(--grafite)}
.btn-1:hover{background:#fff}
.btn-1 span{color:#5d544d}
.btn-2{border:1.5px solid rgba(239,231,218,.5);color:var(--creme)}
.btn-2:hover{background:rgba(239,231,218,.08)}
.btn-2 span{color:var(--suave)}
.fim{margin-top:38px;display:flex;justify-content:center;gap:26px;font-size:14px}
.fim a{color:var(--suave);text-decoration:none;border-bottom:1px solid rgba(239,231,218,.3);padding-bottom:2px}
.fim a:hover{color:var(--creme)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<main>
 <img class="foto" src="raissa.jpg" alt="Raíssa Lobo" width="108" height="108">
 <h1>Raíssa Lobo</h1>
 <div class="tag">Marca para mentores</div>
 <p class="frase">Marca genérica compete por preço<br><em>Marca original é a escolha óbvia</em></p>

 <div class="botoes">
  <a class="btn btn-1" href="/sessao">
   <strong>Diagnóstico da sua comunicação</strong>
   <span>45 minutos comigo, ao vivo, para descobrir se a sua marca é genérica ou original</span>
  </a>
  <a class="btn btn-2" href="https://marketingdecria.com/rota30k" rel="noopener">
   <strong>Rota 30K</strong>
   <span>Para quem está começando a monetizar o que sabe</span>
  </a>
 </div>

 <nav class="fim" aria-label="Outros canais">
  <a href="https://www.linkedin.com/in/araissalobo/" rel="noopener">LinkedIn</a>
  <a href="https://youtube.com/@araissalobo" rel="noopener">YouTube</a>
 </nav>
</main>
</body>
</html>
